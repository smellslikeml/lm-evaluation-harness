task: medxpertqa
dataset_path: TsinghuaC3I/MedXpertQA
dataset_name: Text
output_type: multiple_choice
test_split: test
fewshot_split: dev
doc_to_text: !function utils_medxpertqa.doc_to_text
doc_to_target: !function utils_medxpertqa.doc_to_target
doc_to_choice: [ 'A','B','C','D','E','F','G','H','I','J' ]
should_decontaminate: true
doc_to_decontamination_query: "{{question}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
